<script>

try{start()}catch(e){console.error(e);fail(e.message)}
function start(){
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), norm=a=>{let l=Math.hypot(...a)||1;return a.map(x=>x/l)}, cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
let scene='dam', quality=matchMedia('(max-width:760px)').matches?0:1, mode=0,color=0,paused=false,tool='stir',elapsed=0, gravity=9.8,viscosity=.18,cohesion=.35,strength=.65,speed=1;
const palettes=[[.065,.63,.9],[.06,.77,.40],[.48,.25,.95],[1,.33,.055],[.65,.83,.91]];const sizes=[760,1350,2250];const scales=[.62,.82,1];
const box=[2.4,2.8,1.55];let N=0,p,v,old,lambda,delta,head,next,spacing,h,h2,rest,cellX,cellY,cellZ,simTime=0;
let yaw=.65,pitch=.37,dist=9.4,target=[0,1.02,0],cam,right,up,forward,fov=.68;
const psize=()=>spacing*.76;
function grid(){cellX=Math.ceil(2*box[0]/h)+3;cellY=Math.ceil(box[1]/h)+3;cellZ=Math.ceil(2*box[2]/h)+3;head=new Int32Array(cellX*cellY*cellZ);next=new Int32Array(N)}
function idx(x,y,z){return (z*cellY+y)*cellX+x}function cell(x,y,z){return [clamp(Math.floor((x+box[0])/h)+1,0,cellX-1),clamp(Math.floor(y/h)+1,0,cellY-1),clamp(Math.floor((z+box[2])/h)+1,0,cellZ-1)]}
function rebuild(){head.fill(-1);for(let i=0;i<N;i++){let j=i*3;let x=clamp(Math.floor((p[j]+box[0])/h)+1,0,cellX-1),y=clamp(Math.floor(p[j+1]/h)+1,0,cellY-1),z=clamp(Math.floor((p[j+2]+box[2])/h)+1,0,cellZ-1);let c=idx(x,y,z);next[i]=head[c];head[c]=i}}
function neighbors(i,cb){let k=i*3,x=p[k],y=p[k+1],z=p[k+2],c=cell(x,y,z);for(let zz=Math.max(0,c[2]-1);zz<=Math.min(cellZ-1,c[2]+1);zz++)for(let yy=Math.max(0,c[1]-1);yy<=Math.min(cellY-1,c[1]+1);yy++)for(let xx=Math.max(0,c[0]-1);xx<=Math.min(cellX-1,c[0]+1);xx++)for(let j=head[idx(xx,yy,zz)];j!==-1;j=next[j]){if(j===i)continue;let l=j*3,dx=x-p[l],dy=y-p[l+1],dz=z-p[l+2],d2=dx*dx+dy*dy+dz*dz;if(d2<h2&&d2>1e-10)cb(j,dx,dy,dz,d2)}}
function init(which=scene){scene=which;N=sizes[quality];spacing=.225*Math.pow(1350/N,1/3);h=spacing*1.78;h2=h*h;rest=0;for(let x=-2;x<=2;x++)for(let y=-2;y<=2;y++)for(let z=-2;z<=2;z++){let q=1-(x*x+y*y+z*z)*spacing*spacing/h2;if(q>0)rest+=q*q*q}p=new Float32Array(N*3);v=new Float32Array(N*3);old=new Float32Array(N*3);lambda=new Float32Array(N);delta=new Float32Array(N*3);grid();let coords=[];
const add=(x,y,z)=>coords.push([x,y,z]);let r=spacing*.45;
if(which==='dam'){let nz=Math.max(3,Math.floor(2.7/spacing)),nx=Math.max(Math.ceil(Math.cbrt(N*1.0)),Math.ceil(N/(nz*Math.floor(2.55/spacing))));for(let y=0;coords.length<N;y++)for(let x=0;x<nx&&coords.length<N;x++)for(let z=0;z<nz&&coords.length<N;z++)add(-box[0]+r+.04+x*spacing,r+.02+y*spacing,(z-(nz-1)/2)*spacing)}
else if(which==='drop'||which==='zero'){let radius=Math.cbrt(N*spacing**3*3/(4*Math.PI))*1.09;let candidates=[];for(let x=-radius;x<=radius;x+=spacing)for(let y=-radius;y<=radius;y+=spacing)for(let z=-radius;z<=radius;z+=spacing)candidates.push([x,y,z,x*x+y*y+z*z]);candidates.sort((a,b)=>a[3]-b[3]);for(let i=0;i<N;i++){let a=candidates[i];add(a[0],a[1]+(which==='drop'?1.55:1.4),a[2])}}
else {let nx=Math.floor(4.35/spacing),nz=Math.floor(2.7/spacing);for(let y=0;coords.length<N;y++)for(let x=0;x<nx&&coords.length<N;x++)for(let z=0;z<nz&&coords.length<N;z++)add((x-(nx-1)/2)*spacing,r+.02+y*spacing,(z-(nz-1)/2)*spacing)}
for(let i=0;i<N;i++){let j=i*3;for(let k=0;k<3;k++)p[j+k]=coords[i][k]+(Math.random()-.5)*spacing*.045;bounds(i)}elapsed=0;simTime=0;$('#count').textContent=N.toLocaleString();$('.presets .active')?.classList.remove('active');$('[data-scene="'+which+'"]').classList.add('active');}
function bounds(i){let j=i*3,r=spacing*.42;p[j]=clamp(p[j],-box[0]+r,box[0]-r);p[j+1]=clamp(p[j+1],r,box[1]-r);p[j+2]=clamp(p[j+2],-box[2]+r,box[2]-r)}
let stir={on:false,pos:[0,1,0],vel:[0,0,0]};
function step(dt){simTime+=dt;let damp=Math.pow(.998,dt*60);for(let i=0;i<N;i++){let j=i*3;old[j]=p[j];old[j+1]=p[j+1];old[j+2]=p[j+2];v[j]*=damp;v[j+1]=v[j+1]*damp-gravity*dt;v[j+2]*=damp;if(scene==='fountain'){let q=p[j]**2+p[j+2]**2;if(q<.35&&p[j+1]<1.0){let power=(1-q/.35)*(1-p[j+1]/1.3);v[j+1]+=38*power*dt;v[j]+=p[j]*3*dt;v[j+2]+=p[j+2]*3*dt}}if(stir.on){let dx=p[j]-stir.pos[0],dy=p[j+1]-stir.pos[1],dz=p[j+2]-stir.pos[2],rr=dx*dx+dy*dy+dz*dz;if(rr<1.8){let f=(1-rr/1.8)**2*(.4+strength*2);v[j]+=(stir.vel[0]*5+dx*4)*f*dt;v[j+1]+=(stir.vel[1]*5+dy*4)*f*dt;v[j+2]+=(stir.vel[2]*5+dz*4)*f*dt}}let m=Math.hypot(v[j],v[j+1],v[j+2]);if(m>12){let f=12/m;v[j]*=f;v[j+1]*=f;v[j+2]*=f}p[j]+=v[j]*dt;p[j+1]+=v[j+1]*dt;p[j+2]+=v[j+2]*dt;bounds(i)}
let iterations=quality===2?4:3;for(let it=0;it<iterations;it++){rebuild();for(let i=0;i<N;i++){let dens=1,gx=0,gy=0,gz=0,s=0;neighbors(i,(j,dx,dy,dz,d2)=>{let q=1-d2/h2;dens+=q*q*q;let k=-6*q*q/(h2*rest),a=k*dx,b=k*dy,c=k*dz;gx+=a;gy+=b;gz+=c;s+=a*a+b*b+c*c});let C=Math.max(dens/rest-1,-cohesion*.10);lambda[i]=-C/(s+gx*gx+gy*gy+gz*gz+12)}
for(let i=0;i<N;i++){let x=0,y=0,z=0;neighbors(i,(j,dx,dy,dz,d2)=>{let q=1-d2/h2;let sc=-.005*(q/.91)**4;let k=(lambda[i]+lambda[j]+sc)*(-6*q*q/(h2*rest));x+=k*dx;y+=k*dy;z+=k*dz});let j=i*3,m=Math.hypot(x,y,z),f=m>spacing*.35?spacing*.35/m:1;delta[j]=x*f;delta[j+1]=y*f;delta[j+2]=z*f}
